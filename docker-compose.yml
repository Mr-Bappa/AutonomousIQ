services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autonomousiq
      POSTGRES_PASSWORD: autonomousiq
      POSTGRES_DB: autonomousiq
    ports:
      - "5432:5432"
    volumes:
      - autonomousiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonomousiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  formula-sidecar:
    build:
      context: ./services/formula-sidecar
      dockerfile: Dockerfile
    ports:
      - "8801:8801"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8801/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://autonomousiq:autonomousiq@postgres:5432/autonomousiq
      FORMULA_SIDECAR_URL: http://formula-sidecar:8801
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      formula-sidecar:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  autonomousiq_pgdata:
